layer: 'scaffolding'

project:
  title: 'imgsrv'
  description: 'Go service and workspace-level automation for imgsrv.'
  owner: 'meigma'
  maintainers:
    - 'meigma maintainers'

toolchains:
  default: 'go'

workspace:
  inheritedTasks:
    include: []

fileGroups:
  go:
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'internal/**/*.sql'
    - 'go.mod'
    - 'go.sum'
  lintConfig:
    - '.golangci.yml'
    - '.prototools'
    - '.moon/proto/golangci-lint.toml'

tasks:
  build:
    command: 'go build -o bin/imgsrv ./cmd/imgsrv'
    toolchains: ['go']
    inputs:
      - '@group(go)'
    outputs:
      - 'bin/imgsrv'

  format:
    command: 'proto run golangci-lint -- fmt --config .golangci.yml --diff'
    toolchains: ['go']
    inputs:
      - '@group(go)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    command: 'proto run golangci-lint -- run --config .golangci.yml ./... --show-stats=false'
    toolchains: ['go']
    inputs:
      - '@group(go)'
      - '@group(lintConfig)'
    options:
      cache: false

  test:
    command: 'go test ./...'
    toolchains: ['go']
    inputs:
      - '@group(go)'
    options:
      cache: false

  test-integration:
    command: 'go'
    args:
      - 'test'
      - '-tags=integration'
      - './internal/integration/...'
    toolchains: ['go']
    inputs:
      - '@group(go)'
    options:
      cache: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'root:test-integration'
    options:
      cache: false
      runInCI: true
