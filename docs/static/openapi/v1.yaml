        '200':
          description: Image aliases in stable order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasList'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/images/{name}/aliases/{alias}:
    put:
      operationId: putAlias
      summary: Create or move an image alias to a published version.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageName'
        - $ref: '#/components/parameters/AliasName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAliasRequest'
      responses:
        '200':
          description: Image alias created or moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    get:
      operationId: getAlias
      summary: Get one image alias.
      parameters:
        - $ref: '#/components/parameters/ImageName'
        - $ref: '#/components/parameters/AliasName'
      responses:
        '200':
          description: Image alias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAlias
      summary: Delete one image alias.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageName'
        - $ref: '#/components/parameters/AliasName'
      responses:
        '204':
          description: Image alias deleted.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/images/{name}/refs/{ref}:
    get:
      operationId: resolveManifest
      summary: Resolve a published manifest by exact version or alias.
      parameters:
        - $ref: '#/components/parameters/ImageName'
        - $ref: '#/components/parameters/ImageRef'
      responses:
        '200':
          description: Published image version manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    UploadID:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UploadID'
    OIDCProvisioningRuleID:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AuthPrincipalID:
      name: principal_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AuthRoleID:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        enum:
          - auth-manager
          - content-writer
    AuthAPITokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BlobDigest:
      name: digest
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Digest'
    ImageName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
    ImageVersion:
      name: version
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._+:-]{0,127}$'
    AliasName:
      name: alias
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    ImageRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._+:-]{0,127}$'
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ArtifactID'
    AttachmentID:
      name: attachment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AttachmentID'
    Range:
      name: Range
      in: header
      required: false
      schema:
        type: string
      description: >
        One supported byte range: `bytes=start-end`, `bytes=start-`, or
        `bytes=-suffix_length`. Multi-range requests are rejected.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      schema:
        type: string
    IfRange:
      name: If-Range
      in: header
      required: false
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, malformed, unknown, or revoked bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated bearer token is not authorized for the requested action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BlobOK:
      description: Full blob body.
      headers:
        Accept-Ranges:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
        Content-Type:
          schema:
            type: string
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    BlobPartial:
      description: Partial blob body for one satisfied range.
      headers:
        Accept-Ranges:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
        Content-Range:
          schema:
            type: string
        Content-Type:
          schema:
            type: string
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    BlobHeadOK:
      description: Blob metadata.
      headers:
        Accept-Ranges:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
        Content-Type:
          schema:
            type: string
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
    BlobNotModified:
      description: Cache validator matched current blob representation.
      headers:
        Accept-Ranges:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
        ETag:
          schema:
            type: string
        Last-Modified:
          schema:
            type: string
    RangeNotSatisfiable:
      description: Requested range was invalid, unsupported, or unsatisfiable.
      headers:
        Content-Range:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      examples:
        - sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    UploadID:
      type: string
      format: uuid
    ArtifactID:
      type: string
      format: uuid
    AttachmentID:
      type: string
      format: uuid
    AuthRole:
      type: object
      required:
        - id
        - display_name
        - description
        - actions
      properties:
        id:
          type: string
          enum:
            - auth-manager
            - content-writer
        display_name:
          type: string
        description:
          type: string
        actions:
          type: array
          items:
            type: string
      additionalProperties: false
    AuthRoleList:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AuthRole'
      additionalProperties: false
    CreateAuthPrincipalRequest:
      type: object
      required:
        - kind
        - display_name
      properties:
        kind:
          type: string
          enum:
            - user
            - service
        display_name:
          type: string
          minLength: 1
        attributes:
          type: object
          additionalProperties: true
      additionalProperties: false
    AuthPrincipal:
      type: object
      required:
        - id
        - kind
        - display_name
        - role_ids
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - user
            - service
        display_name:
          type: string
        attributes:
          type: object
          additionalProperties: true
        role_ids:
          type: array
          items:
            type: string
      additionalProperties: false
    AuthPrincipalList:
      type: object
      required:
        - principals
      properties:
        principals:
          type: array
          items:
            $ref: '#/components/schemas/AuthPrincipal'
      additionalProperties: false
    IssueAuthAPITokenRequest:
      type: object
      required:
        - expires_at
      properties:
        name:
          type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    AuthAPIToken:
      type: object
      required:
        - id
        - principal_id
        - name
        - expires_at
      properties:
        id:
          type: string
        principal_id:
          type: string
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        plaintext:
          type: string
          description: Full bearer token secret. Present only in issue responses.
      additionalProperties: false
    AuthAPITokenList:
      type: object
      required:
        - api_tokens
      properties:
        api_tokens:
          type: array
          items:
            $ref: '#/components/schemas/AuthAPIToken'
      additionalProperties: false
    SaveOIDCProvisioningRuleRequest:
      type: object
      required:
        - display_name
        - issuer_url
        - audience
        - condition
      properties:
        id:
          type: string
          minLength: 1
        display_name:
          type: string
        issuer_url:
          type: string
          format: uri
        audience:
          type: string
          minLength: 1
        forwarded_claims:
          type: array
          items:
            type: string
            minLength: 1
        condition:
          type: string
          minLength: 1
          maxLength: 4096
        enabled:
          type: boolean
      additionalProperties: false
    OIDCProvisioningRule:
      type: object
      required:
        - id
        - display_name
        - issuer_url
        - audience
        - condition
        - assign_role_ids
        - enabled
      properties:
        id:
          type: string
        display_name:
          type: string
        issuer_url:
          type: string
          format: uri
        audience:
          type: string
        forwarded_claims:
          type: array
          items:
            type: string
        condition:
          type: string
        assign_role_ids:
          type: array
          items:
            type: string
        enabled:
          type: boolean
      additionalProperties: false
    OIDCProvisioningRuleList:
      type: object
      required:
        - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/OIDCProvisioningRule'
      additionalProperties: false
    OIDCProvisioningRuleReconciliation:
      type: object
      required:
        - rule_id
        - unassign_role_ids
        - principals
        - applied
      properties:
        rule_id:
          type: string
        unassign_role_ids:
          type: array
          items:
            type: string
        principals:
          type: array
          items:
            $ref: '#/components/schemas/AuthPrincipal'
        applied:
          type: boolean
      additionalProperties: false
    UploadState:
      type: string
      enum:
        - created
        - uploading
        - completed
        - ingesting
        - ready
        - failed
        - aborted
    ImageVersionState:
      type: string
      enum:
        - draft
        - published
    ArtifactFormat:
      type: string
      enum:
        - raw
        - raw.gz
        - qcow2
    BeginUploadRequest:
      type: object
      required:
        - expected_digest
        - expected_size_bytes
      properties:
        expected_digest:
          $ref: '#/components/schemas/Digest'
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 0
        media_type_hint:
          type: string
          minLength: 1
        filename_hint:
          type: string
          minLength: 1
      additionalProperties: false
    CompleteUploadRequest:
      type: object
      required:
        - parts
      properties:
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompleteUploadPart'
      additionalProperties: false
    CompleteUploadPart:
      type: object
      required:
        - number
        - etag
        - size_bytes
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    UploadSession:
      type: object
      required:
        - id
        - expected_digest
        - expected_size_bytes
        - state
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/UploadID'
        expected_digest:
          $ref: '#/components/schemas/Digest'
        expected_size_bytes:
          type: integer
          format: int64
          minimum: 0
        state:
          $ref: '#/components/schemas/UploadState'
