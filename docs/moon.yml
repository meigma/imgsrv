language: 'typescript'
layer: 'application'
stack: 'frontend'
tags:
  - 'docs'
  - 'docusaurus'

project:
  title: 'imgsrv docs'
  description: 'Docusaurus documentation site for imgsrv.'
  owner: 'meigma'
  maintainers:
    - 'meigma maintainers'

toolchains:
  default: 'node'

fileGroups:
  configs:
    - 'docusaurus.config.ts'
    - 'tsconfig.json'
    - 'package.json'
    - 'package-lock.json'
  sources:
    - 'docs/**/*'
    - 'src/**/*'
    - 'static/**/*'

tasks:
  start:
    command: 'npm run start'
    toolchains: ['javascript', 'node', 'npm']
    options:
      persistent: true
      runInCI: false
  serve:
    command: 'npm run serve'
    toolchains: ['javascript', 'node', 'npm']
    options:
      runInCI: false
